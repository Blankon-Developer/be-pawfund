name: pawfund-local

services:
  postgres:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pawfund}
      POSTGRES_USER: ${POSTGRES_USER:-pawfund}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pawfund}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  postgres-test:
    image: postgres:18.4-alpine3.24
    profiles: ["test"]
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:-pawfund_test}
      POSTGRES_USER: ${POSTGRES_TEST_USER:-pawfund_test}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-pawfund_test}
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    restart: "no"

  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    # The community image runs as a non-root user, while a fresh named volume is
    # root-owned. This override keeps the persistent local-development volume writable.
    user: root
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --spider http://localhost:9000/minio/health/live",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio-test:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["test"]
    user: root
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_TEST_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_TEST_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_TEST_API_PORT:-9002}:9000"
    tmpfs:
      - /data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://localhost:9000/minio/health/live >/dev/null",
        ]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    restart: "no"

  redis:
    image: redis:8.8.1-alpine3.23
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis-test:
    image: redis:8.8.1-alpine3.23
    profiles: ["test"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_TEST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    restart: "no"

  rabbitmq:
    image: rabbitmq:4.3.4-management-alpine
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pawfund}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pawfund}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  rabbitmq-test:
    image: rabbitmq:4.3.4-management-alpine
    profiles: ["test"]
    tmpfs:
      - /var/lib/rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_TEST_AMQP_PORT:-5673}:5672"
      - "127.0.0.1:${RABBITMQ_TEST_MGMT_PORT:-15673}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_TEST_USER:-pawfund_test}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_TEST_PASSWORD:-pawfund_test}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: "no"

volumes:
  postgres_data:
  minio_data:
  redis_data:
  rabbitmq_data:
